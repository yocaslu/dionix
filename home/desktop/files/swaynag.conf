# swaynag - visual TUI com as cores do tema ativo (igual à Waybar e ao Sway)
# Cores no formato RRGGBB[AA]; veja `man 5 swaynag`.
font=JetBrainsMono Nerd Font 11

[warning]
background=@base00-hex@
text=@base05-hex@
border=@base09-hex@
border-bottom=@base09-hex@
border-bottom-size=1
button-background=@base00-hex@
button-text=@base09-hex@
button-border-size=1
button-padding=4
button-gap=8
message-padding=8

[error]
background=@base00-hex@
text=@base05-hex@
border=@base08-hex@
border-bottom=@base08-hex@
border-bottom-size=1
button-background=@base00-hex@
button-text=@base08-hex@
button-border-size=1
button-padding=4
button-gap=8
message-padding=8
