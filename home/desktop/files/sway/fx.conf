# SwayFX - efeitos no visual TUI: cantos retos,
# sombras, blur nas superfícies translúcidas e escurecimento das janelas sem foco.
corner_radius 0
titlebar_separator disable

shadows enable
shadow_blur_radius 20
shadow_color @base00@cc
shadow_inactive_color @base00@80

blur enable
blur_xray disable
blur_passes 2
blur_radius 3

default_dim_inactive 0.15
dim_inactive_colors.unfocused @base00@ff
dim_inactive_colors.urgent @base08@ff

# Barra, notificações, lançador, menus e OSD (namespaces de layer-shell)
layer_effects "waybar" blur enable; shadows enable
layer_effects "swaync-control-center" blur enable; shadows enable
layer_effects "swaync-notification-window" blur enable; shadows enable
layer_effects "launcher" blur enable; shadows enable
layer_effects "wlr_which_key" blur enable; shadows enable
layer_effects "logout_dialog" blur enable
layer_effects "swayosd" blur enable; shadows enable
